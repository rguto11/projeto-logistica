name: logistica

services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistica}
      POSTGRES_USER: ${POSTGRES_USER:-logistica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistica_pwd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - logistica-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    # Sem porta publicada no host: apenas o Servico de Dados acessa o banco.

  servico-dados:
    build: ./servico-dados
    image: logistica/servico-dados:1.0
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-logistica}
      DB_USER: ${POSTGRES_USER:-logistica}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-logistica_pwd}
    ports:
      - "${PORTA_DADOS:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logistica-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  servico-processamento:
    build: ./servico-processamento
    image: logistica/servico-processamento:1.0
    environment:
      DADOS_URL: http://servico-dados:8001
      # Timeouts em cascata: 5 s (Dados) < 30 s (Relatorio) < 60 s (gunicorn). Ver README.
      HTTP_TIMEOUT: "5"
    ports:
      - "${PORTA_PROCESSAMENTO:-8002}:8002"
    depends_on:
      servico-dados:
        condition: service_healthy
    networks:
      - logistica-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  servico-relatorio:
    build: ./servico-relatorio
    image: logistica/servico-relatorio:1.0
    environment:
      DADOS_URL: http://servico-dados:8001
      PROCESSAMENTO_URL: http://servico-processamento:8002
      # Maior que o pior caso do Processamento (~16 s) e menor que o --timeout 60 do gunicorn.
      HTTP_TIMEOUT: "30"
    ports:
      - "${PORTA_RELATORIO:-8003}:8003"
    depends_on:
      servico-dados:
        condition: service_healthy
      servico-processamento:
        condition: service_healthy
    networks:
      - logistica-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  logistica-net:
    driver: bridge

volumes:
  pgdata: {}
